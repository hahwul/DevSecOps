{# Phase icon dispatch. Set `icon` to one of:
   design | develop | build | test | deploy | operate
   Emits a standalone 32x32 svg. Strokes var(--ink) width 3; token fills only. #}
<svg viewBox="0 0 32 32" fill="none" aria-hidden="true" focusable="false" stroke-linecap="round" stroke-linejoin="round">
{% if icon == "design" %}
  <circle cx="16" cy="16" r="12.5" stroke="var(--ink)" stroke-width="3"/>
  <path d="M16 7.5L19 16l-3 8.5L13 16z" fill="var(--c-sec)" stroke="var(--ink)" stroke-width="2.4"/>
{% elif icon == "develop" %}
  <path d="M10.5 9L4 16l6.5 7M21.5 9L28 16l-6.5 7" stroke="var(--ink)" stroke-width="3"/>
  <path d="M18 6.5l-4 19" stroke="var(--ink)" stroke-width="3"/>
{% elif icon == "build" %}
  <path d="M4 9.5L16 3l12 6.5L16 16z" fill="var(--c-dev)"/>
  <path d="M16 3l12 6.5v13L16 29 4 22.5v-13z" stroke="var(--ink)" stroke-width="3"/>
  <path d="M4 9.5L16 16l12-6.5M16 16v13" stroke="var(--ink)" stroke-width="3"/>
{% elif icon == "test" %}
  <circle cx="13.5" cy="13.5" r="9.5" stroke="var(--ink)" stroke-width="3"/>
  <path d="M20.5 20.5L28 28" stroke="var(--ink)" stroke-width="3.4"/>
  <circle cx="13.5" cy="13.5" r="3.4" fill="var(--c-bug)" stroke="var(--ink)" stroke-width="2"/>
  <path d="M9.5 11l-2.4-1.4M9.5 16l-2.4 1.4M17.5 11l2.4-1.4M17.5 16l2.4 1.4" stroke="var(--ink)" stroke-width="1.8"/>
{% elif icon == "deploy" %}
  <path d="M3 15L29 4 14.5 18.5z" fill="var(--c-ops)"/>
  <path d="M3 15L29 4 20 28l-5.5-9.5z" stroke="var(--ink)" stroke-width="3"/>
  <path d="M29 4L14.5 18.5" stroke="var(--ink)" stroke-width="3"/>
{% elif icon == "operate" %}
  <circle cx="16" cy="16" r="12.5" stroke="var(--ink)" stroke-width="3"/>
  <circle cx="16" cy="16" r="6.5" stroke="var(--ink)" stroke-width="2" stroke-dasharray="2 3"/>
  <path d="M16 16l8.5-8.5" stroke="var(--ink)" stroke-width="3"/>
  <circle cx="21" cy="19" r="2.4" fill="var(--c-bug)" stroke="var(--ink)" stroke-width="1.6"/>
{% endif %}
</svg>
