  description_ja: "サプライチェーンセキュリティやポリシーダッシュボード、AIトリアージを備えたマルチクラスタKubernetesダッシュボード。"

# Operate / SECURITY-AUDIT
- name: Prowler
  phase: operate
  category: SECURITY-AUDIT
  url: https://github.com/prowler-cloud/prowler
  description: "Cloud security auditing with 100+ checks for standards like CIS, GDPR, and HIPAA."
  description_ko: "CIS, GDPR, HIPAA 같은 표준에 대한 100개 이상의 점검을 제공하는 클라우드 보안 감사 도구입니다."
  description_ja: "CISやGDPR、HIPAAなどの標準に対する100以上のチェックを備えたクラウドセキュリティ監査ツール。"

# Operate / SECURITY-SCAN
- name: Trivy
  phase: operate
  category: SECURITY-SCAN
  url: https://github.com/aquasecurity/trivy
  description: "All-in-one security scanner for container images, file systems, and Git repositories."
  description_ko: "컨테이너 이미지, 파일 시스템, Git 저장소를 아우르는 올인원 보안 스캐너입니다."
  description_ja: "コンテナイメージ、ファイルシステム、Gitリポジトリを対象とするオールインワンのセキュリティスキャナ。"
